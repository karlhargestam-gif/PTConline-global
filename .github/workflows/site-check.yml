name: Site check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check page size, canonical URLs, structured data, links, robots and sitemap
        run: python3 .github/scripts/site_check.py --host ptconline.global --max-page-kb 1024
      - name: Check widgets/catalog.json matches the course pages
        run: python3 .github/scripts/build_catalog.py --check
