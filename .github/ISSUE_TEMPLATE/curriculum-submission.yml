name: Curriculum submission
description: Offer a course or curriculum to the Pentecostal Theological Consortium. Use the private curriculum repo for real offers. This form is the field list.
title: "Course offer: "
labels: ["submission", "submitted"]
body:
  - type: markdown
    attributes:
      value: |
        Real offers should go to the private repo named in docs/curriculum-pipeline.md, because this issue stores a name and an email. The public form at /submit/ opens that issue only after Karl approves the environment variables.
  - type: input
    id: offer-title
    attributes:
      label: Course title
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: input
    id: material
    attributes:
      label: HTTPS link to the material
  - type: dropdown
    id: licence
    attributes:
      label: Licence agreed
      options:
        - ptc-nonexclusive-draft-2026-10-28
        - cc-by-nc-sa-4.0
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I own this material, or I have the rights to offer it.
          required: true
        - label: I give permission to publish under the licence selected above. The wording is a draft for legal review.
          required: true
        - label: PTC may store my name and email so someone can reply.
          required: true
